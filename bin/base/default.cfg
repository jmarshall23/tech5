in_joystick 1
vehicle_stickControl 0

// ================================================================================
// First Person Mode Bindings
// ================================================================================
bindset 0
unbindall

// Movement
bind "w"			"_moveforward"
bind "s"			"_moveback"
bind "a"			"_moveLeft"
bind "d"			"_moveRight"
bind "SPACE"		"_jump"
bind "SHIFT"		"_sprint"
bind "c"			"_crouch"
bind "f"			"_use"
bind "r"			"_reload"
bind "ESCAPE"		"toggleMainMenu"
bind "j"			"_inventory"
bind "x"			"_toggledualwield"
bind "q"			"_togglefiremodeleft"
bind "e"			"_togglefiremoderight"

// Weapons
bind "1"			"_weap0"
bind "2"			"_weap1"
bind "3"			"_weap2"
bind "4"			"_weap3"
bind "5"			"_weap4"
bind "6"			"_weap5"
bind "7"			"_weap6"

bind "MOUSE1"		"_attack1"
bind "MOUSE2"		"_zoom"
bind "MWHEELDOWN"	"_weapprevinv"
bind "MWHEELUP"		"_weapnextinv"

bind "ALT"			"_covermode"

bind "LEFTARROW"	"_lookLeft"
bind "RIGHTARROW"	"_lookRight"
bind "PGUP"			"_lookUp"
bind "PGDN"			"_lookDown"

// client commands
bind F5				"savegame quick"
bind F9				"loadgame quick"
bind F12			"screenshot"


// ================================================================================
// Multiplayer First Person Mode Bindings
// ================================================================================
bindset 1
unbindall


// ================================================================================
// Vehicle Driving Mode Bindings
// ================================================================================
bindset 2
unbindall

bind "w" "_moveforward"
bind "a" "_moveLeft"
bind "d" "_moveRight"
bind "s" "_moveback"

bind "SPACE"	"_sprint"			// Handbrake
bind "f"		"_use"				// Horn
bind "ESCAPE"	"toggleMainMenu"
bind "j"		"_inventory"

// Mouse
bind "MOUSE2" "_zoom"				// free-look


// ================================================================================
// Possess Mode Bindings
// ================================================================================
bindset 3
unbindall


// ================================================================================
// Remote Mode Bindings
// ================================================================================
bindset 4
unbindall


// ================================================================================
// Vehicle Gunner Mode Bindings
// ================================================================================
bindset 5
unbindall


// ================================================================================
// Vehicle Passenger Mode Bindings
// ================================================================================
bindset 6
unbindall


exec joystick.cfg


// Always go back to bindset 0 before exiting the config
bindset 0
